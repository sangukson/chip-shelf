<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="클립 서랍">
<title>클립 서랍</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="vendor/seed-design/base.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 목록 -->
<div id="home" class="screen">
  <div class="body">
    <h1 class="title">클립 서랍</h1>

    <form id="openForm" class="open" novalidate>
      <input id="url" class="input" type="url" inputmode="url" autocomplete="off" placeholder="유튜브 링크 붙여넣기" aria-label="유튜브 링크" aria-describedby="openHint">
      <button class="btn brand" type="submit">열기</button>
    </form>
    <p class="hint" id="openHint" role="status"></p>

    <input id="q" class="input search" type="search" placeholder="검색" aria-label="클립 검색" hidden>
    <div id="list"></div>

    <details class="backup">
      <summary>백업</summary>
      <textarea id="backupText" class="input" rows="3" aria-label="백업 데이터" spellcheck="false"></textarea>
      <div class="row">
        <button type="button" id="exportBtn" class="btn weak">내보내기</button>
        <button type="button" id="importBtn" class="btn weak">불러오기</button>
      </div>
      <p class="hint" id="backupHint" role="status"></p>
    </details>
  </div>
</div>

<!-- 재생·편집 -->
<div id="editor" class="screen" hidden>
  <header class="bar">
    <button type="button" id="backBtn" class="icon" aria-label="목록으로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></svg>
    </button>
    <a id="ytLink" class="link" target="_blank" rel="noopener">유튜브</a>
  </header>

  <div class="player"><div id="player"></div><p id="playerMsg" class="playermsg" hidden></p></div>

  <div class="body">
    <div class="now-row">
      <span class="now" id="now" aria-label="현재 위치">0:00</span>
      <button type="button" id="previewBtn" class="btn weak">구간 재생</button>
    </div>

    <div class="marks">
      <button type="button" id="markIn" class="mark">
        <span class="mark-label">시작</span>
        <span class="mark-time" id="startView">찍기</span>
      </button>
      <button type="button" id="markOut" class="mark">
        <span class="mark-label">끝</span>
        <span class="mark-time" id="endView">찍기</span>
      </button>
    </div>
    <p class="hint" id="hint" role="status"></p>

    <form id="clipForm" novalidate>
      <input id="start" type="hidden">
      <input id="end" type="hidden">
      <input id="title" class="input" autocomplete="off" placeholder="제목" aria-label="제목">
      <button type="button" id="noteToggle" class="link">메모 추가</button>
      <textarea id="note" class="input" rows="3" placeholder="메모" aria-label="메모" hidden></textarea>
      <button type="button" id="deleteBtn" class="link danger" hidden>삭제</button>
      <div class="cta">
        <button class="btn brand big" type="submit" id="saveBtn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
